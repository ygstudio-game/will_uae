<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OWA Platform Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700;900&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{
  --plum:#382852;--plum-d:#281b40;--red:#c73a30;--red-h:#ad3128;--gold:#d7b48b;--gold-t:#8a6233;
  --violet:#5b3fb0;--lav:#efeaf7;--mist:#f7f5fb;--bg:#fbfaf8;--paper:#fffdf9;
  --ink:#231a30;--text:#3b3346;--muted:#6c6478;--line:#e4dfe9;--line2:#cfc6da;--soft:#efeaf3;
  --ok:#2f7a55;--ok-t:#1f5a3d;--ok-bg:#e8f4ee;--warn:#b7791f;--warn-t:#7a4f0e;--warn-bg:#fbf3e4;
  --err:#b42318;--err-t:#7a1d14;--err-bg:#fdecea;
  --serif:Merriweather,Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ar:"Noto Naskh Arabic","Geeza Pro","Arial",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--violet);text-underline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{max-width:100%}
.sr{position:absolute!important;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.scroll{position:relative}
@media(max-width:560px){.btn.btn{white-space:normal}}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:16px;z-index:100;background:#fff;padding:8px 12px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w1120{max-width:1120px}.w1040{max-width:1040px}.w960{max-width:960px}.w720{max-width:720px}.w920{max-width:920px}.w460{max-width:460px}.w1280{max-width:1280px}
main{padding-block:36px 64px}
.stack{display:flex;flex-direction:column;gap:24px}
.stack-s{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-t)}
h1,.h1{font-family:var(--serif);font-weight:900;color:var(--ink);font-size:clamp(26px,3vw,36px);line-height:1.2;margin:0;text-wrap:balance}
h1:focus{outline:none}
h2,.h2{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:19px;line-height:1.3;margin:0;text-wrap:balance}
h3{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:17px;margin:0}
.lab{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.lede{max-width:68ch}
.muted{color:var(--muted)}.small{font-size:14.5px}.xs{font-size:13px}
.ink{color:var(--ink)}.b{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card.strong{border:1.5px solid var(--plum)}.card.dash{border:1.5px dashed var(--line2)}.card.gold{border:2px solid var(--gold)}
.card.tint{background:var(--lav);border-color:transparent}
.card.tight{padding:18px;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:1.5px solid transparent;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;line-height:1.2;text-align:center}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-h)}
.btn-plum{background:var(--plum);color:#fff}.btn-plum:hover{background:var(--plum-d)}
.btn-line{background:#fff;border-color:var(--line2);color:var(--ink)}.btn-line:hover{border-color:var(--plum)}
.btn-out{background:#fff;border-color:var(--plum);color:var(--plum)}
.btn-dk{background:transparent;border-color:#b9acd0;color:#fff}
.btn-gold{background:var(--gold);color:var(--plum-d)}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:#fff;border-color:var(--warn);color:var(--warn-t)}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px}
.btn-block{width:100%}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.lnk{background:none;border:0;color:var(--violet);font-weight:600;padding:8px 4px;min-height:44px;font-size:14.5px;text-decoration:underline;text-underline-offset:3px}
.lnk.danger{color:var(--err)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:14px;font-weight:600;color:var(--ink)}
.opt{font-weight:400;color:var(--muted)}
input:not([type]),input[type=text],input[type=email],input[type=tel],input[type=password],input[type=date],input[type=search],select,textarea{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line2);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
textarea{min-height:0;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--mist);color:var(--muted)}
input.ar{font-family:var(--ar);font-size:18px;direction:rtl;padding-block:6px}
.ar{font-family:var(--ar)}
[aria-invalid="true"]{border:2px solid var(--err)!important}
.hint{font-size:13px;color:var(--muted)}
.ferr{font-size:13px;font-weight:600;color:var(--err)}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--plum);flex:none}
.g2{display:grid;gap:18px 20px;grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
.full{grid-column:1/-1}
.split{display:grid;gap:24px;grid-template-columns:minmax(0,1fr) 330px;align-items:start}
.split-l{display:grid;gap:20px;grid-template-columns:320px minmax(0,1fr);align-items:start}
.doc-grid{grid-template-columns:230px minmax(0,1fr)}.desk-grid{grid-template-columns:340px minmax(0,1fr)}
@media(max-width:940px){.split,.split-l,.doc-grid,.desk-grid{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 11px;white-space:nowrap;line-height:1.5}
.chip.v{background:var(--lav);color:#4a3a86}.chip.ok{background:var(--ok-bg);color:var(--ok-t)}.chip.warn{background:var(--warn-bg);color:var(--warn-t)}
.chip.err{background:var(--err-bg);color:var(--err-t)}.chip.grey{background:#f1eef5;color:var(--text)}.chip.red{background:var(--red);color:#fff}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:3px;background:#fff}
.seg button{border:0;border-radius:999px;background:transparent;color:var(--text);font-weight:600;font-size:14px;min-height:40px;padding:0 16px}
.seg button[aria-pressed="true"]{background:var(--plum);color:#fff}
.alert{border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.alert ul{margin:0;padding-left:20px}
.alert.err{background:var(--err-bg);border:1px solid #f1b8b2;color:var(--err-t)}.alert.err a{color:var(--err-t)}
.alert.ok{background:var(--ok-bg);color:var(--ok-t)}.alert.warn{background:var(--warn-bg);color:var(--warn-t);border:1px solid #ecd3a6}
.alert.info{background:var(--lav);color:var(--ink)}
.alert h2{font-family:var(--sans);font-size:16px;color:inherit}
.ico{flex:none;display:inline-block;vertical-align:middle}

/* header */
header.top{background:var(--plum-d);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 24px;padding-block:10px}
.brand{display:flex;flex-direction:column;color:#fff;text-decoration:none;line-height:1.25}
.brand b{font-family:var(--serif);font-size:17px;white-space:nowrap}
.brand span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.nav{display:flex;gap:0 22px}
.nav a{color:#d9d0e6;text-decoration:none;font-weight:500;font-size:15px;padding:12px 0;border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:#fff}
.nav a[aria-current="page"]{color:#fff;font-weight:600;border-color:var(--gold)}
.top-r{display:flex;align-items:center;gap:12px}
.top-r a:not(.btn),.top-r button.plain{color:#fff;background:none;border:0;font-size:14.5px;font-weight:600;padding:10px 4px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--plum-d);display:grid;place-items:center;font-size:13px;font-weight:700}
.staff{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--plum-d);background:var(--gold);border-radius:999px;padding:3px 10px}
@media(max-width:760px){.nav{order:3;width:100%;overflow-x:auto}.top-r .who{display:none}.top-r{margin-left:auto;gap:10px}}
@media(max-width:430px){.brand b{font-size:15px}.top-r .btn-sm{padding:0 12px;font-size:13px;min-height:38px}.top-in{gap:6px 10px}}

/* footer */
footer.foot{background:var(--plum-d);color:#d9d0e6;font-size:14px}
footer.foot .wrap{padding-block:40px 26px;display:flex;flex-direction:column;gap:24px}
footer.foot a{color:#fff}
.foot-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 40px}
.foot small{display:block;padding-top:16px;border-top:1px solid #45375c;font-size:13px;color:#c9bfd8}

/* hero */
.hero{background:var(--plum);color:#fff}
.hero-in{display:grid;gap:40px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center;padding-block:60px 68px}
.hero h1{color:#fff;font-size:clamp(30px,4vw,46px);max-width:18ch}
.hero p{color:#e3dbee}.hero .mock p{color:var(--muted)}
@media(max-width:940px){.hero-in{grid-template-columns:minmax(0,1fr)}}
.mock{background:var(--paper);color:var(--ink);border-radius:8px;box-shadow:0 24px 48px -28px rgba(0,0,0,.55);overflow:hidden}
.mock-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.6fr);gap:16px;padding:13px 18px;border-bottom:1px solid var(--soft)}
.mock-row b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.mock-row span{font-family:var(--serif);font-size:13px;line-height:1.6}
.mock-row .ar{font-size:16px;text-align:right}
.stamp{border:1.5px dashed var(--gold-t);color:var(--gold-t);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.num{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--plum);color:#fff;font-family:var(--serif);font-weight:700;font-size:15px;flex:none}
.num.line{background:#fff;border:2px solid var(--plum);color:var(--ink)}.num.dash{background:#fff;border:2px dashed var(--line2);color:var(--muted)}
.steps5{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.steps5 li{border-top:3px solid var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:6px}
@media(max-width:900px){.steps5{grid-template-columns:minmax(0,1fr)}}

/* wizard */
.wizbar{background:#fff;border-bottom:1px solid var(--line)}
.wizbar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.steps{list-style:none;margin:0;padding:0 0 2px;display:flex;gap:6px;overflow-x:auto;position:relative}
.steps a{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;border:1px solid var(--line);color:var(--ink)}
.steps a .n{font-size:12px;font-weight:700;color:var(--muted)}
.steps a.cur{background:var(--plum);color:#fff;border-color:var(--plum);font-weight:600}.steps a.cur .n{color:var(--gold)}
.steps a.todo{border-style:dashed;color:var(--muted)}
.actionbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;background:#fff;border:1px solid var(--line);border-radius:12px}
.doc-tile{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.doc-tile.done{border-color:#b9dcc9;background:#f3faf6}
.doc-tile.need{border:2px dashed var(--line2);padding:15px}
.doc-tile.bad{border:2px dashed var(--err);background:#fffafa;padding:15px}
.fname{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.dl{display:grid;gap:12px 20px;grid-template-columns:repeat(3,minmax(0,1fr));margin:0}
.dl dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dl dd{margin:0;color:var(--ink)}
@media(max-width:640px){.dl{grid-template-columns:minmax(0,1fr)}}
.slotlab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.cascade{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cascade li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center}
.cascade .rail{justify-self:center;width:2px;height:28px;background:var(--line2)}
.cascade .cond{font-size:12.5px;font-weight:600;color:var(--gold-t)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.tl li{border-top:3px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:4px}
@media(max-width:760px){.tl{grid-template-columns:minmax(0,1fr)}}
.sharerow{display:grid;gap:10px 16px;grid-template-columns:minmax(0,1fr) 130px 44px;align-items:center;padding:12px 0;border-top:1px solid var(--soft)}
@media(max-width:560px){.sharerow{grid-template-columns:minmax(0,1fr) 44px}.sharerow>div:first-child{grid-column:1/-1}.sharerow .pct{max-width:160px}}
.pct{display:flex;align-items:center;gap:6px}
.pct input{text-align:right;font-variant-numeric:tabular-nums}
.alloc{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line2);background:var(--mist)}
.alloc div{display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;transition:flex-basis .25s}
.flow-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.flow-box{border:1.5px solid var(--line2);border-left-width:4px;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}.flow-cond{align-self:center;text-align:center}
.namerow{display:grid;gap:8px 16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 170px;align-items:center;padding:12px 0;border-top:1px solid var(--soft)}
@media(max-width:820px){.namerow{grid-template-columns:minmax(0,1fr)}}
.namerow>*{min-width:0}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.checks li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.checks a{font-weight:700;color:var(--ink);text-decoration:none}
@media(max-width:820px){.checks{grid-template-columns:minmax(0,1fr)}}
.sig-wrap{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center}
.sigbox{border:1px solid var(--line2);border-radius:8px;background:#fff;background-image:linear-gradient(45deg,#f3f0f6 25%,transparent 25%,transparent 75%,#f3f0f6 75%),linear-gradient(45deg,#f3f0f6 25%,transparent 25%,transparent 75%,#f3f0f6 75%);background-size:16px 16px;background-position:0 0,8px 8px;min-height:120px;min-width:min(320px,100%);display:grid;place-items:center;padding:14px}
.sigbox img{max-width:100%;max-height:130px;display:block}
.lock{background:var(--warn-bg);color:var(--warn-t);border:1px solid #ecd3a6}

/* dashboard */
.tracker{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(7,minmax(0,1fr))}
.tracker li{display:flex;flex-direction:column;gap:6px;min-width:0}
.tracker .bar{height:6px;border-radius:3px;background:var(--line)}
.tracker .bar.done{background:var(--ok)}.tracker .bar.cur{background:var(--plum)}
.tracker span{font-size:12.5px;line-height:1.35;color:var(--muted)}
.tracker .cur+span,.tracker .done+span{color:var(--ink)}
.tracker .cur+span{font-weight:700}
@media(max-width:720px){.tracker span:not(.bar){display:none}.tracker{gap:4px}}
.tr-m{display:none;font-size:14px;color:var(--ink)}@media(max-width:720px){.tr-m{display:block}}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-variant-numeric:tabular-nums}
.kv>:last-child{white-space:nowrap}.kv+.kv{padding-top:12px;border-top:1px solid var(--soft)}
.vstep{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px}
.vstep .rail{display:flex;flex-direction:column;align-items:center}
.vstep .line{flex:1 1 auto;width:2px;background:var(--line2);min-height:24px}
.vstep .line.ok{background:var(--ok)}
.dot{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:700;font-size:14px;flex:none}
.dot.ok{background:var(--ok);color:#fff}.dot.cur{background:var(--plum);color:#fff}.dot.todo{border:2px solid var(--line2);color:var(--muted);background:#fff}

/* tables */
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
.t th{text-align:left;padding:12px 14px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--mist);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid var(--soft);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.life{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(9,minmax(0,1fr))}
.life li{display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.life li.done{background:#f3faf6;border-color:#b9dcc9}
.life li.cur{background:var(--plum);border-color:var(--plum);color:#fff}
.life .n{font-size:11.5px;font-weight:700;color:var(--muted)}.life li.cur .n{color:var(--gold)}.life li.done .n{color:var(--ok-t)}
.life .l{font-size:13px;line-height:1.3;font-weight:600;color:var(--ink)}.life li.cur .l{color:#fff}
.life .w{font-size:11.5px;color:var(--muted)}.life li.cur .w{color:#d9d0e6}
@media(max-width:1000px){.life{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.life{grid-template-columns:minmax(0,1fr)}}
.note{border-left:3px solid var(--warn);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}

/* messages */
.tlist{display:flex;flex-direction:column;gap:10px}
.tcard{display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px;text-align:left;width:100%}
.tcard[aria-current="true"]{border:2px solid var(--plum);padding:14px 16px}
.thread{list-style:none;margin:0;padding:22px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:78%;display:flex;flex-direction:column;gap:4px}
.msg .by{font-size:12.5px;color:var(--muted)}
.msg .bub{border-radius:14px;padding:12px 15px;white-space:pre-wrap}
.msg.me{align-self:flex-end}.msg.me .by{text-align:right}
.msg.me .bub{background:var(--lav);color:var(--ink);border-radius:14px 14px 4px 14px}
.msg.them .bub{background:var(--plum);color:#fff;border-radius:14px 14px 14px 4px}
.msg.client .bub{background:var(--mist);border:1px solid var(--line);color:var(--ink);border-radius:14px 14px 14px 4px}
.msg.owa{align-self:flex-end}.msg.owa .by{text-align:right}.msg.owa .bub{background:var(--plum);color:#fff;border-radius:14px 14px 4px 14px}
@media(max-width:560px){.msg{max-width:92%}}

/* document */
.doc{background:var(--paper);border:1px solid var(--line2);border-radius:6px;overflow:hidden;box-shadow:0 18px 40px -30px rgba(40,27,64,.5);min-width:0}
.doc-h{padding:24px 24px 18px;border-bottom:2px solid var(--gold);text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.doc-h .t{font-family:var(--serif);font-weight:900;font-size:20px;letter-spacing:.12em;color:var(--ink)}
.doc-h .s{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.doc-h .ar{font-size:19px;color:var(--gold-t)}
.sec-h{display:flex;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--plum);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sec-h .ar{letter-spacing:0;text-transform:none;font-size:15px;font-weight:600}
.bi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--line)}
.bi>div{padding:16px 20px;font-family:var(--serif);font-size:14.5px;line-height:1.85;color:var(--ink);min-width:0}
.bi>div[dir="rtl"]{font-family:var(--ar);font-size:17px;line-height:1.95;border-inline-start:1px solid var(--line)}
.missing{color:var(--err);font-weight:700}
@media(max-width:640px){.bi{grid-template-columns:minmax(0,1fr)}.bi>div[dir="rtl"]{border-inline-start:0;border-top:1px solid var(--line)}}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:center;min-height:40px;padding:0 10px;border-radius:8px;color:var(--ink);font-size:14px;text-decoration:none;white-space:nowrap}
.toc a:hover{background:var(--mist)}
.toc .n{font-size:12px;font-weight:700;color:var(--muted);min-width:20px}
@media(max-width:940px){.toc{flex-direction:row;overflow-x:auto;gap:6px}}
.sheet{background:#fff;max-width:794px;margin:0 auto;padding:48px 48px 40px;border:1px solid var(--line2);box-shadow:0 18px 40px -30px rgba(40,27,64,.5)}
.sheet .bi{border:1px solid var(--line2);border-top:0}
.sheet .sec-h{margin-top:14px}
.sheet .bi>div{font-size:13.5px}.sheet .bi>div[dir="rtl"]{font-size:16px}
.sheet-foot{display:flex;justify-content:space-between;gap:12px;padding-top:12px;margin-top:20px;border-top:1px solid var(--line2);font-size:12px;color:#55495f}
@media(max-width:640px){.sheet{padding:24px 16px}}

/* overlays */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);font-size:14.5px;pointer-events:auto;display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:var(--gold);font-weight:700;padding:4px}
.modal-bg{position:fixed;inset:0;background:rgba(26,16,32,.55);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:#fff;border-radius:14px;max-width:600px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
#proto{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:80;font-size:14px}
.proto-btn{background:#1a1020;color:#fff;border:2px solid var(--gold);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
.proto-panel{position:absolute;right:0;bottom:52px;width:min(340px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:16px;box-shadow:0 20px 40px -16px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px}
.proto-panel h2{font-family:var(--sans);font-size:14px}
.proto-panel .grp{display:flex;flex-direction:column;gap:2px}
.proto-panel a{display:block;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:13.5px}
.proto-panel a:hover{background:var(--mist)}
@media(max-width:560px){.proto-btn{padding:7px 12px;font-size:12px}}
@media print{
  header.top,footer.foot,#proto,#toast,.no-print,.wizbar{display:none!important}
  body{background:#fff} main{padding:0}
  .sheet{box-shadow:none;border:0;padding:0;max-width:none}
  .sec-h{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bi{break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
