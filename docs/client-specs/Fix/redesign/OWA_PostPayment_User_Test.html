function profileErrors(p,isTest=false){if(!p)return['Choose a person.'];let e=[];if(!p.name.trim())e.push('Full name is required.');if(!validDate(p.dob)||Number.isNaN(years(p.dob))||years(p.dob)<0)e.push('Enter a valid date of birth.');if(isTest&&years(p.dob)<21)e.push('The testator must be at least 21.');if(!p.nationality.trim())e.push('Nationality is required.');if(!p.passport.trim())e.push('Passport number is required.');if(p.passport.trim()&&state.people.some(other=>other.id!==p.id&&other.passport.replace(/[^a-z0-9]/gi,'').toLowerCase()===p.passport.replace(/[^a-z0-9]/gi,'').toLowerCase()))e.push('This passport is already used by another profile. Select that existing person instead.');if(!p.docs.passport)e.push('Upload a passport, or request help in a ticket.');if(p.resident&&(!p.docs.eid||!p.eid.trim()))e.push('Add the Emirates ID number and upload for this UAE resident.');if(!p.address.trim()||!p.country.trim())e.push('Residential address and country are required.');if(isTest){if(!p.docs.proof)e.push('Upload proof of address.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email))e.push('Enter a valid email address.');if(p.phone.replace(/\D/g,'').length<8)e.push('Enter a phone number.');}return e}

function submittedQuestionnaire(){return head('Your application is with OWA.','Your team manages corrections with you. You can upload replacement documents below.')+`<div class="stack"><div class="callout green">${ico('shield')}<div><strong>${esc(state.status)}</strong><p>View the latest draft, or raise a ticket to change any details. You do not need to pay again for a correction.</p></div></div><div class="row wrap"><button class="btn primary" onclick="openPreview()">View latest draft</button><button class="btn" onclick="newTicket('Application correction')">Request a correction</button></div><div class="card"><div class="cardhead"><h3>Replace a document</h3></div><div class="cardbody">${usedPeople().map(p=>`<div class="taskline"><div class="person"><div class="avatar">${esc(initials(p.name))}</div><div><strong>${esc(p.name)}</strong><span class="muted">${Object.keys(p.docs).join(' · ')||'Documents needed'}</span></div></div><button class="link small" onclick="editPerson('${p.id}')">View / replace →</button></div>`).join('')}</div></div></div>`}
function detailsPage(){let p=testator();return `<div class="cols"><div class="stack"><div class="card"><div class="cardhead"><div><h3>1. Your documents</h3><p class="small muted">Upload once. We will reuse your details across your Will.</p></div><span class="pill">Manual review follows</span></div><div class="cardbody"><div class="grid3">${uploadBox(p,'passport','Passport')}${p.resident?uploadBox(p,'eid','Emirates ID'):''}${uploadBox(p,'proof','Proof of address')}</div>${state.package==='couples'&&willIndex===1?`<button class="link small" style="margin-top:12px" onclick="reuseProof()">Use the first partner’s address proof (same address)</button>`:''}<div class="spread wrap" style="margin-top:17px"><span class="small muted">Missing a passport? <button class="link small" onclick="newTicket('Missing passport')">Ask OWA for help</button></span><button class="btn small soft" onclick="demoExtract()">Try sample extraction</button></div></div></div><div class="card"><div class="cardhead"><h3>2. Check your details</h3><span class="pill amber">You can edit every field</span></div><div class="cardbody">${personFields(p,true)}</div></div>${nextActions(0)}</div><div class="stack aside-notes"><div class="callout">${ico('shield')}<div><strong>Checked by a person</strong><p>AI can suggest details and flag issues. OWA manually verifies every application.</p></div></div><div class="card"><div class="cardbody"><h3>Have these ready</h3><p class="small muted">Your passport, Emirates ID if applicable, and an address document such as a utility bill or bank statement.</p><hr class="divider"><h3>Living outside the UAE?</h3><p class="small muted">Enter your actual current address. OWA will review your documents and template details.</p></div></div></div></div>`}
function nextActions(idx){return `<div class="actions"><button class="btn" onclick="${idx?'setPage(\'wizard\','+(idx-1)+')':'setPage(\'dashboard\')'}">← Back</button><div class="row right">${saveLabel()}<button class="btn primary" onclick="nextSection(${idx})">Save & continue ${ico('arrow')}</button></div></div>`}
function showErrors(e){const box=$('#errors')||$('#modal-errors');if(!box){toast(e[0]);return}box.innerHTML='<strong>Please check the following:</strong><ul>'+e.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';box.classList.add('show');box.focus();box.scrollIntoView({behavior:'smooth',block:'center'})}
function nextSection(i){const errs=errorsFor(i);if(errs.length)return showErrors(errs);save();section=i+1;render();window.scrollTo(0,0)}
function childrenPage(){let w=current();return `<div class="stack"><div class="card"><div class="cardbody spread wrap"><div><h3>Do you have children under 18?</h3><p class="small muted">You can include a maximum of five children.</p></div><div class="segmented"><button class="${w.hasChildren?'active':''}" onclick="setChildren(true)">Yes</button><button class="${w.hasChildren===false?'active':''}" onclick="setChildren(false)">No</button></div></div></div>${w.hasChildren?`<div class="card"><div class="cardhead"><h3>Your children</h3><span class="pill">${w.children.length} of 5</span></div><div class="cardbody">${w.children.length?w.children.map((id,i)=>`<div class="taskline"><div class="person"><div class="avatar">${esc(initials(name(id)))}</div><div><strong>${esc(name(id))}</strong><span class="muted">${date(person(id).dob)} · ${years(person(id).dob)} years old</span></div></div><div class="row"><button class="link small" onclick="editPerson('${id}')">Edit</button><button class="remove" aria-label="Remove child" onclick="removeChild(${i})">×</button></div></div>`).join(''):'<div class="empty">Add your first child to continue.</div>'}<div class="row wrap" style="margin-top:18px"><button class="btn soft" onclick="chooseChild()" ${w.children.length>=5?'disabled':''}>+ Add a child</button><span class="small muted">Address and identity documents required.</span></div></div></div><div class="callout">${ico('people')}<div><strong>One set of guardians for all children</strong><p>You’ll choose a permanent guardian, a substitute permanent guardian, and optionally a temporary guardian in step 4.</p></div></div>`:`<div class="callout green">${ico('check')}<div><strong>${w.hasChildren===null?'Please choose Yes or No above.':'No guardianship details needed.'}</strong><p>${w.hasChildren===null?'This answer determines whether guardian appointments are required.':'We’ll skip guardian appointments for this Will. You can still choose adults as beneficiaries.'}</p></div></div>`}${nextActions(1)}</div>`}
function personSelect(value,handler,exclude=[]){return `<select onchange="${handler}"><option value="">Choose an existing person</option>${state.people.filter(p=>!exclude.includes(p.id)).map(p=>`<option value="${p.id}" ${value===p.id?'selected':''}>${esc(p.name||'Unnamed person')}</option>`).join('')}</select>`}
function roleCard(title,id,handler,description,exclude=[]){let p=person(id);return `<div class="rolecard"><div class="spread"><h3>${title}</h3>${p?`<span class="pill ${profileErrors(p).length?'amber':'green'}">${profileErrors(p).length?'Details needed':'Profile complete'}</span>`:''}</div><p class="small muted">${description}</p><div class="selector"><label class="field">Select a person${personSelect(id,handler,[current().testator,...exclude])}</label><button class="btn small" onclick="editPerson(null)">+ New person</button></div>${p?`<div class="persondetail"><span>${esc(p.nationality)} · ${p.resident?'UAE resident':'Outside UAE'}<br>${esc(p.address||'Address needed')}</span><button class="link small" onclick="editPerson('${id}')">Edit shared profile →</button></div>`:''}</div>`}
function executorsPage(){let w=current();return `<div class="cols"><div><div class="callout" style="margin-bottom:18px">${ico('file')}<span>Your first executor acts first. Additional executors are substitutes in the order shown.</span></div>${w.executors.map((id,i)=>roleCard(['First executor *','Second executor · substitute','Third executor · further substitute'][i],id,`setExecutor(${i},this.value)`,['The person who will carry out your wishes.','Acts if the first executor cannot act.','Acts if the first and second executors cannot act.'][i])).join('')}<div class="spread" style="margin-top:18px"><button class="btn soft" onclick="addExecutor()" ${w.executors.length>=3?'disabled':''}>+ Add substitute executor</button>${w.executors.length>1?'<button class="link small" onclick="removeExecutor()">Remove last substitute</button>':''}</div>${nextActions(2)}</div><div class="callout aside-notes">${ico('people')}<div><strong>Reuse someone you’ve already added</strong><p>A beneficiary can also be an executor. Selecting the same person reuses their identity documents and address.</p>${state.package==='couples'?'<p>Choose executors separately for each partner’s Will.</p>':''}</div></div></div>`}
function guardiansPage(){let w=current();if(w.hasChildren===null)return `<div class="callout">Answer the children question before choosing guardians.</div><button class="btn primary" style="margin-top:20px" onclick="setPage('wizard',1)">Go to children</button>`;if(!w.hasChildren)return `<div class="card"><div class="cardbody"><div class="callout green">${ico('check')}<div><strong>This section does not apply.</strong><p>You have no children under 18 listed for this Will.</p></div></div></div></div>${nextActions(3)}`;return `<div class="cols"><div><div class="callout" style="margin-bottom:18px">${ico('people')}<div>These appointments cover ${w.children.map(id=>esc(name(id))).join(', ')||'all children added in step 2'}.<p>Permanent and substitute permanent guardians are required. Temporary guardianship is optional.</p></div></div>${roleCard('1. Permanent guardian *',w.guardians.permanent,"setGuardian('permanent',this.value)",'The person you appoint to care for your children.')}${!w.guardians.permanent?`<button class="link small" style="margin:10px 0" onclick="setGuardian('permanent','${willIndex?'p1':'p2'}')">Suggest spouse: ${esc(name(willIndex?'p1':'p2'))} →</button>`:''}${roleCard('1.1 Substitute permanent guardian *',w.guardians.substitute,"setGuardian('substitute',this.value)",'Your alternative permanent guardian.')}${roleCard('2. Temporary / interim guardian · optional',w.guardians.temporary,"setGuardian('temporary',this.value)",'For interim care when the appointed permanent guardian cannot take custody. Choose someone in the UAE.')}<div class="small muted" style="margin-top:10px">For this flow, a UAE Emirates ID supports the temporary guardian’s UAE presence.</div>${nextActions(3)}</div><div class="callout aside-notes">${ico('file')}<div><strong>Documents and addresses</strong><p>Passport for every guardian. Emirates ID for UAE residents. Residential address is compulsory; address proof is not required.</p></div></div></div>`}
function allocationView(group){let w=current(),a=w[group],total=a.reduce((s,x)=>s+(+x.share||0),0),max=group==='primary'?3:2,sub=group==='substitutes';return `<div class="card"><div class="cardhead"><div><h3>${sub?'Shared substitute beneficiaries':'Primary beneficiaries'}</h3><p class="small muted">${sub?'A alone receives 100%, or divide 100% between A and B.':'Choose up to three people. All shares must total 100%.'}</p></div><span class="pill">${a.length} / ${max}</span></div><div class="cardbody">${a.map((x,i)=>`<div class="benefitrow"><label class="field">${sub?'Substitute '+(i?'B':'A'):'Primary beneficiary '+(i+1)} *${personSelect(x.id,`setBeneficiary('${group}',${i},this.value)`,[w.testator])}</label><label class="field">Share *<div class="shareinput"><input aria-label="${sub?'Substitute '+(i?'B':'A'):'Primary beneficiary '+(i+1)} percentage" type="number" value="${x.share}" min="0.01" max="100" step="0.01" ${a.length===1?'readonly':''} oninput="setShare('${group}',${i},this.value)"><span>%</span></div></label><button class="remove" aria-label="Remove beneficiary ${i+1}" onclick="removeBeneficiary('${group}',${i})" ${a.length===1?'disabled':''}>×</button></div>${x.id?`<div class="spread" style="margin:6px 0 0"><span class="small muted">${profileErrors(person(x.id)).length?'Profile needs details':'Shared identity profile attached'}</span><button class="link small" onclick="editPerson('${x.id}')">Edit profile</button></div>`:''}`).join('')}<div class="spread wrap" style="margin-top:20px"><button class="btn soft small" onclick="addBeneficiary('${group}')" ${a.length>=max?'disabled':''}>+ ${sub?'Add substitute B':'Add primary beneficiary'}</button><button class="link small" onclick="editPerson(null)">+ Create a new person</button></div><hr class="divider"><div id="allocation-summary">${allocationSummary(group)}</div></div><div class="cardfoot small">${sub?'This group applies only if none of your primary beneficiaries survives you.':'If a primary beneficiary does not survive you, surviving primaries receive the residue in proportion to their original shares.'}</div></div>`}
function allocationSummary(group){let a=current()[group],total=a.reduce((s,x)=>s+(+x.share||0),0);return `<div class="spread"><strong class="small">${group==='primary'?'Primary':'Substitute'} allocation</strong><span class="pill ${Math.abs(total-100)<.00001?'green':'amber'}">${Number(total.toFixed(2))}% of 100%</span></div><div class="allocation">${a.map(x=>`<span style="width:${Math.max(0,Math.min(100,+x.share||0))}%">${+x.share||0}%</span>`).join('')}</div><div class="small muted">${total===100?'Fully allocated.':total<100?`${Number((100-total).toFixed(2))}% left to allocate.`:`${Number((total-100).toFixed(2))}% overallocated. Adjust the shares to continue.`}</div>`}
function beneficiariesPage(){let sub=benefitTab===1;return `<div class="segmented" style="margin-bottom:22px"><button class="${!sub?'active':''}" onclick="benefitTab=0;render()">1 · Primary beneficiaries</button><button class="${sub?'active':''}" onclick="benefitTab=1;render()">2 · Shared substitutes</button></div><div class="cols"><div class="stack">${state.package==='couples'&&willIndex===1?`<div class="callout spread wrap"><span>Use the first Will as a starting point.</span><button class="link small" onclick="copyWill()">Copy beneficiaries & guardians →</button></div>`:''}${allocationView(sub?'substitutes':'primary')}${sub?`<div class="callout">${ico('file')}<div><strong>A’s fallback in the template</strong><p>If this substitute group applies and A does not survive you or fails to take a vested interest, A’s share passes equally to A’s surviving children. This clause is not automatically applied to B.</p></div></div>`:''}<div class="actions"><button class="btn" onclick="${sub?'benefitTab=0;render()':"setPage('wizard',3)"}">← Back</button><button class="btn primary" onclick="benefitNext()">${sub?'Save & review':'Continue to substitutes'} ${ico('arrow')}</button></div></div><div class="stack aside-notes"><div class="card"><div class="cardbody"><div class="eyebrow">How your choices work</div><div class="stage"><span class="stepnum">1</span><div><strong>Your primary beneficiaries</strong><p>Receive the percentages you set.</p></div></div><div class="stage"><span class="stepnum">2</span><div><strong>If some primaries do not survive</strong><p>The surviving primaries share proportionally. A sole survivor receives 100%.</p></div></div><div class="stage"><span class="stepnum">3</span><div><strong>If no primary survives</strong><p>The shared A / B group takes effect.</p></div></div></div></div><div class="callout">Both groups total 100% separately. Substitutes do not receive an extra share alongside surviving primaries.</div></div></div>`}
function reviewPage(){let w=current(),errors=allErrors();return `<div class="stack">${state.package==='couples'?`<div class="callout">${ico('people')}<span>One partner can review both Wills. Both questionnaires must be complete before generating the drafts.</span></div>`:''}<div class="card"><div class="cardhead"><h3>Your choices at a glance</h3><span class="pill ${errors.length?'amber':'green'}">${errors.length?'Details still needed':'Ready to generate'}</span></div><div class="cardbody">${[0,1,2,3,4].map(i=>`<div class="taskline"><div class="row"><span class="stepnum">${errorsFor(i).length?'!':'✓'}</span><div><strong class="small">${steps[i]}</strong><div class="small muted">${[`${esc(testator().name)} · ${esc(testator().nationality)}`,w.hasChildren?w.children.map(id=>esc(name(id))).join(', '):'No children under 18',w.executors.filter(Boolean).map(id=>esc(name(id))).join(' → '),w.hasChildren?`Permanent: ${esc(name(w.guardians.permanent))}`:'No guardian appointments needed',`${w.primary.map(x=>`${esc(name(x.id))} ${x.share}%`).join(' · ')}`][i]}</div></div></div><button class="link small" onclick="setPage('wizard',${i})">Edit →</button></div>`).join('')}<div class="subtlebox" style="margin-top:18px"><strong class="small">If no primary beneficiary survives</strong><p class="small muted">${w.substitutes.map((x,i)=>`${i?'B':'A'} · ${esc(name(x.id))}: ${x.share}%`).join(' / ')}</p></div></div></div>${state.package==='couples'?`<div class="card"><div class="cardbody">${state.wills.map((other,i)=>`<div class="taskline"><div><strong class="small">Will ${i+1} · ${esc(name(other.testator))}</strong><p class="small muted">${[0,1,2,3,4].every(j=>!errorsFor(j,other).length)?'All questionnaire sections complete':'Some sections need attention'}</p></div><button class="link small" onclick="switchWill(${i});setPage('wizard',0)">Review →</button></div>`).join('')}</div></div>`:''}<div class="card"><div class="cardbody"><h3>View your draft before sending to OWA</h3><p class="small muted">The preview shows how your information fits into the template. OWA will verify the details and prepare the final version.</p><div class="row wrap" style="margin-top:20px"><button class="btn primary" onclick="generateDraft()">Generate ${state.package==='couples'?'both drafts':'draft preview'} ${ico('arrow')}</button>${draft().version?`<button class="btn" onclick="openPreview()">View latest draft · v${draft().version}</button>`:''}</div></div></div><div class="callout">${ico('shield')}<div><strong>No additional OWA payment at this step.</strong><p>The court fee is AED 950 per Will, paid directly to ADJD when instructed.</p></div></div></div>`}
function peoplePage(){return head('The people in your Will.','One profile per person. Reuse their details and documents for every appointment.')+`<div class="spread" style="margin-bottom:20px"><span class="small muted">${state.people.length} saved profiles · all fictional test data</span><button class="btn primary" onclick="editPerson(null)">+ Add a person</button></div><div class="grid2">${state.people.map(p=>`<div class="card"><div class="cardbody"><div class="spread"><div class="person"><div class="avatar">${esc(initials(p.name))}</div><div><strong>${esc(p.name||'Unnamed person')}</strong><span class="muted">${esc(p.nationality||'Nationality needed')}</span></div></div><button class="link small" onclick="editPerson('${p.id}')">Edit →</button></div><p class="small muted" style="margin-top:18px">${esc(p.address||'Address needed')}</p><div class="row wrap" style="margin-top:14px"><span class="pill ${profileErrors(p).length?'amber':'green'}">${profileErrors(p).length?'Needs details':'Profile complete'}</span><span class="small muted">${p.resident?'UAE resident':'Outside UAE'}</span></div></div></div>`).join('')}</div>`}
const clauseNames=['Declaration','Executors & trustees','Debts & expenses','Letter of wishes','Jurisdiction','Insurance proceeds','Distribution of estate','Powers of trustees','Guardianship','Execution & attestation'];
function previewPage(){if(!draft().version)return head('Your draft preview.','Complete the questionnaire to create your preview.')+`<div class="card"><div class="empty"><h2>A few details first.</h2><p>Complete the required sections${state.package==='couples'?' for both Wills':''} before generating your draft.</p><button class="btn primary" style="margin-top:20px" onclick="setPage('wizard',5)">Go to review ${ico('arrow')}</button></div></div>`;if(draft().file)return revisedPreviewPage();let snap=draft().snapshot||captureSnapshot(current()),w=snap.will,p=snap.people.find(x=>x.id===w.testator),c=clauseIndex;const name=id=>snap.people.find(x=>x.id===id)?.name||'Not selected';
let summaries=[`I, <mark>${esc(p.name)}</mark>, of <mark>${esc(p.nationality)}</mark> nationality, born on <mark>${date(p.dob)}</mark>, holder of passport number <mark>${esc(p.passport)}</mark>, residing at <mark>${esc(p.address)}, ${esc(p.country)}</mark>.`,`First executor: <mark>${esc(name(w.executors[0]))}</mark>.<br><br>${w.executors.slice(1).filter(Boolean).map((id,i)=>`Substitute ${i+1}: <mark>${esc(name(id))}</mark>.`).join('<br>')}`,'The approved template’s fixed debts and expenses clause will appear here.','The approved template’s fixed letter of wishes clause will appear here.','The approved template’s fixed jurisdiction clause will appear here.','The approved template’s fixed insurance proceeds clause will appear here.',`<strong>Primary beneficiaries</strong><br>${w.primary.map(x=>`<mark>${esc(name(x.id))}</mark> · ${x.share}%`).join('<br>')}<p>If some primaries do not survive, the surviving primaries share proportionally. If none survives:</p>${w.substitutes.map((x,i)=>`${i?'B':'A'} · <mark>${esc(name(x.id))}</mark> · ${x.share}%`).join('<br>')}<p class="small">A’s template fallback to surviving children is retained. These are choices for review, not final legal wording.</p>`,'The approved template’s trustee powers and beneficiary trust-age provisions will appear here.',w.hasChildren?`Permanent guardian:<br><mark>${esc(name(w.guardians.permanent))}</mark><p>Substitute permanent guardian:<br><mark>${esc(name(w.guardians.substitute))}</mark></p>${w.guardians.temporary?`<p>Temporary / interim guardian:<br><mark>${esc(name(w.guardians.temporary))}</mark></p>`:''}<p class="small">Applies to: ${w.children.map(id=>esc(name(id))).join(', ')}.</p>`:'No guardianship appointments are included because no children under 18 have been listed.','Execution and attestation take place through the court process. This interface does not collect a legal signature.'];
return head('Your wishes, in one place.','Review the information below. Tell OWA if anything needs correcting.','DRAFT PREVIEW · VERSION '+draft().version)+`${draft().needsRefresh?'<div class="callout amber" style="margin-bottom:18px">This published version is unchanged. Updated details are awaiting a new draft from OWA.</div>':''}<div class="spread wrap" style="margin-bottom:20px"><span class="pill amber">SAMPLE · NOT REGISTRABLE</span><div class="row"><span class="small muted">View-only · signed-in account</span><button class="btn small" onclick="newTicket('Draft correction')">Request a correction</button></div></div>${draft().file?`<div class="callout green" style="margin-bottom:20px">${ico('file')}<div><strong>Latest admin revision · v${draft().version}</strong><p>${esc(draft().file)}${draft().data?' · Open the revised PDF below.':' · Document bytes are not retained after a refresh; attach again to preview.'}</p>${draft().data?'<button class="link small" onclick="viewUploadedDraft()">View revised PDF in this page →</button>':''}</div></div>`:''}<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:20px"><div class="segmented" style="overflow:auto">${[0,1,6,8].map(i=>`<button class="${c===i?'active':''}" onclick="clauseIndex=${i};render()">${i+1}. ${clauseNames[i]}</button>`).join('')}<button onclick="openClauseList()">All 10 sections</button></div><div class="document"><div class="docbar"><span>LAST WILL AND TESTAMENT</span><span>OWA-DEMO-001 · WILL ${willIndex+1}</span></div><div class="docbody"><h2>LAST WILL AND TESTAMENT</h2><div class="bilingual"><div><div class="clause">${c+1}. ${clauseNames[c]}</div>${summaries[c]}</div><div class="arabic" lang="ar"><div class="clause">الوصية الأخيرة</div><strong>${esc(p.arabic||'النسخة العربية')}</strong><div class="placeholder-lines">${Array.from({length:7},()=>'<i></i>').join('')}</div><p style="direction:ltr;font:12px/1.7 Arial,sans-serif;color:var(--muted);margin-top:25px">The approved Arabic template will run alongside the English. Legal Arabic text is not generated in this prototype.</p></div></div></div><div class="docfoot"><div><div class="eyebrow">What you are reviewing</div><p>${['Your identity and current address','Executor appointments in order','The fixed template clause','The fixed template clause','The fixed template clause','The fixed template clause','Primary percentages and the shared substitute group','The fixed template clause','Guardians for children under 18','The court execution step'][c]}</p></div><div class="row"><button class="btn round" aria-label="Previous clause" onclick="clauseIndex=Math.max(0,clauseIndex-1);render()" ${c===0?'disabled':''}>←</button><span class="small muted">${c+1} / 10</span><button class="btn round" aria-label="Next clause" onclick="clauseIndex=Math.min(9,clauseIndex+1);render()" ${c===9?'disabled':''}>→</button></div></div></div></div>${role==='customer'&&customerCanEdit()?`<div class="card" style="margin-top:22px"><div class="cardbody"><label class="check"><input type="checkbox" id="confirm-draft" ${allWills().every(x=>x.confirmed)?'checked':''}><span>I have reviewed the details${state.package==='couples'?' in both Wills':''} and am ready for OWA to verify my application.</span></label><div class="spread wrap" style="margin-top:20px"><span class="small muted">OWA will check your documents and prepare the final draft.</span><button class="btn primary" onclick="submitReview()">Send to OWA for review ${ico('arrow')}</button></div></div></div>`:`<div class="callout" style="margin-top:20px">${ico('shield')}<span>OWA manages corrections with you through support, email or WhatsApp. The latest version stays available here.</span></div>`}`}
function courtPage(){return head('The court registration step.','Your OWA preparation fee is already paid. Court charges are paid directly to ADJD.')+`<div class="cols"><div class="stack"><div class="card"><div class="cardhead"><h3>ADJD court fee</h3><span class="pill">Paid directly to court</span></div><div class="cardbody"><div class="eyebrow">${state.package==='couples'?'Two Wills':'One Will'}</div><div class="stats">AED ${state.package==='couples'?'1,900':'950'}</div><p class="small muted">AED 950 per Will · separate from the OWA service fee</p><hr class="divider"><h3>Wait for your payment instructions</h3><p class="muted">OWA will guide you through the court payment and registration process. Follow the official instructions provided for your application.</p><div class="callout" style="margin-top:20px">${ico('shield')}<span>No court payment is collected in the OWA checkout.</span></div><button class="btn" style="margin-top:20px" onclick="newTicket('Court payment guidance')">Ask about court payment</button></div></div><div class="card"><div class="cardbody"><h3>After registration</h3><p class="muted">Your dashboard will show “Registration completed”. The court or OWA admin will send your registered Will separately.</p></div></div></div><div class="card"><div class="cardbody"><div class="eyebrow">Application status</div><h3>${esc(state.status)}</h3><p class="small muted">${state.package==='couples'?'One status covers both Wills.':'Your OWA team updates this status.'}</p><hr class="divider"><span class="pill ${state.courtPaid?'green':'amber'}">${state.courtPaid?'Court payment recorded by admin':'Court payment not yet recorded'}</span></div></div></div>`}
function supportPage(){let tickets=state.tickets,t=tickets.find(x=>x.id===selectedTicket)||tickets[0];if(t)selectedTicket=t.id;return head(role==='admin'?'Support & conversations.':'A person to help you through.','Keep questions, requested documents and corrections together.')+`<div class="spread" style="margin-bottom:20px"><span class="small muted">${tickets.filter(x=>x.status!=='Resolved').length} open ${tickets.length===1?'conversation':'conversations'}</span><button class="btn primary" onclick="newTicket()">+ ${role==='admin'?'Request information':'New support ticket'}</button></div><div class="card"><div class="ticketlayout"><div class="ticketlist">${tickets.length?tickets.map(x=>`<button class="ticketitem ${x.id===t.id?'active':''}" onclick="selectedTicket='${x.id}';render()"><div class="spread"><span class="small muted">#${x.id}</span><span class="pill ${x.status==='Resolved'?'green':'amber'}">${x.status}</span></div><h3>${esc(x.subject)}</h3><p>${x.messages.length} messages · ${esc(x.category)}</p></button>`).join(''):'<div class="empty small">Your conversations will appear here.</div>'}</div><div class="thread">${t?`<div class="threadhead spread wrap"><div><span class="eyebrow">#${t.id}</span><h3>${esc(t.subject)}</h3></div>${role==='admin'?`<button class="btn small" onclick="ticketStatus('${t.id}')">${t.status==='Resolved'?'Reopen ticket':'Mark resolved'}</button>`:''}</div><div class="messages">${t.messages.map(m=>`<div class="message ${m.role===role?'mine':''}"><strong>${m.role==='admin'?'OWA support':esc(name('p1'))}</strong><p>${esc(m.text)}</p>${m.file?`<p class="small" style="margin-top:7px">Attachment: ${esc(m.file)}</p>`:''}<time>${esc(m.time)}</time></div>`).join('')}</div><form class="reply" onsubmit="sendReply(event,'${t.id}')"><textarea class="textinput" id="reply" placeholder="Write your message…" aria-label="Reply message" required></textarea><div class="stack" style="gap:7px"><label class="btn small">Attach file<input aria-label="Attach a reply file" type="file" id="reply-file" class="visually-hidden" accept=".pdf,.png,.jpg,.jpeg" onchange="this.parentNode.firstChild.textContent=this.files[0]?'File selected':'Attach file'"></label><button class="btn primary small" type="submit">Send reply ${ico('arrow')}</button></div></form>`:`<div class="empty"><h2>How can we help?</h2><p>Raise a ticket for a missing document, a question, or a correction.</p><button class="btn soft" style="margin-top:20px" onclick="newTicket()">Start a conversation</button></div>`}</div></div></div><p class="small muted" style="margin-top:12px">${role==='admin'?'Production: each new ticket and customer reply triggers an admin email notification.':'Support is included after your OWA payment.'} Messages in this prototype stay in this browser.</p>`}
function queuePage(){return head('Your applications, at a glance.','Review documents, request corrections and keep customers informed.','OWA · ADMIN WORKSPACE')+`<div class="grid3" style="margin-bottom:25px">${[['Applications','1'],['Awaiting review',state.status==='Awaiting OWA review'?'1':'0'],['Open tickets',state.tickets.filter(t=>t.status!=='Resolved').length]].map(([k,v])=>`<div class="card"><div class="cardbody"><div class="eyebrow">${k}</div><div class="stats">${v}</div></div></div>`).join('')}</div><div class="card"><div class="cardhead"><h3>Application queue</h3><span class="pill">Demo workspace</span></div><div class="tablewrap"><table><thead><tr><th>Application</th><th>Package</th><th>OWA fee</th><th>Status</th><th></th></tr></thead><tbody><tr><td><strong>${esc(name('p1'))}</strong><div class="small muted">OWA-DEMO-001</div></td><td>${state.package==='couples'?'Wills for couples':'Individual Will'}</td><td><span class="pill green">Paid</span></td><td>${esc(state.status)}</td><td><button class="btn small" onclick="setPage('adminreview')">Review →</button></td></tr></tbody></table></div></div>`}
function usedPeople(){return [...new Set(allWills().flatMap(w=>[w.testator,...(w.hasChildren?w.children:[]),...w.executors,...(w.hasChildren?Object.values(w.guardians):[]),...w.primary.map(x=>x.id),...w.substitutes.map(x=>x.id)]).filter(Boolean))].map(person)}
function adminReview(){let flagPeople=usedPeople().filter(p=>profileErrors(p,p.id==='p1'||state.package==='couples'&&p.id==='p2').length||p.expiry&&new Date(p.expiry)<new Date());return head(esc(name('p1')),'OWA-DEMO-001 · '+(state.package==='couples'?'Couples application · one shared status':'Individual application'),'APPLICATION REVIEW')+`${state.legacyRevisionFile?`<div class="callout amber" style="margin-bottom:18px">An older prototype stored ${esc(state.legacyRevisionFile)} without a Will assignment. Reattach it to the correct partner’s Will; it has not been assigned automatically.</div>`:''}<div class="cols"><div class="stack"><div class="card"><div class="cardhead"><h3>Identity and documents</h3><span class="pill ${flagPeople.length?'amber':'green'}">${flagPeople.length} profiles flagged</span></div><div class="cardbody"><div class="callout" style="margin-bottom:15px">${ico('shield')}<span>AI flags assist review. Document attachment or extraction does not mean a document has been verified.</span></div>${usedPeople().map(p=>`<div class="taskline"><div><strong class="small">${esc(p.name)}</strong><div class="small muted">${Object.keys(p.docs).join(' · ')||'No documents attached'}${p.expiry&&new Date(p.expiry)<new Date()?' · Expired passport flag':''}</div></div><button class="link small" onclick="editPerson('${p.id}')">Review & edit →</button></div>`).join('')}</div></div><div class="card"><div class="cardhead"><h3>Appointment & allocation summary</h3>${state.package==='couples'?`<select aria-label="Select Will to review" class="textinput" style="max-width:145px" onchange="switchWill(this.value)"><option value="0" ${!willIndex?'selected':''}>Will 1</option><option value="1" ${willIndex?'selected':''}>Will 2</option></select>`:''}</div><div class="cardbody"><strong class="small">${esc(testator().name)}</strong><div class="summaryrow"><span>Executors</span><span>${current().executors.filter(Boolean).map(id=>esc(name(id))).join(' → ')||'Not selected'}</span></div><div class="summaryrow"><span>Permanent guardian</span><span>${current().hasChildren?esc(name(current().guardians.permanent)):'Not applicable'}</span></div>${current().hasChildren?`<div class="summaryrow"><span>Substitute permanent guardian</span><span>${esc(name(current().guardians.substitute))}</span></div><div class="summaryrow"><span>Temporary / interim guardian</span><span>${current().guardians.temporary?esc(name(current().guardians.temporary)):'Not appointed'}</span></div>`:''}<div class="summaryrow"><span>Primary group</span><span>${current().primary.map(x=>`${esc(name(x.id))} ${x.share}%`).join('<br>')}</span></div><div class="summaryrow"><span>Shared substitutes</span><span>${current().substitutes.map((x,i)=>`${i?'B':'A'} · ${esc(name(x.id))} ${x.share}%`).join('<br>')}</span></div><div class="small muted" style="margin-top:10px">The substitute group activates only if no primary survives.</div><div class="row wrap" style="margin-top:18px"><button class="btn small" onclick="adminDraft()">View sample draft</button><button class="btn small" onclick="exportSummary('doc')">Export Word summary</button><button class="btn small" onclick="exportSummary('html')">Print / save PDF summary</button></div><p class="small muted">Exports are data summaries for testing, not court documents.</p></div></div><div class="card"><div class="cardhead"><h3>Latest revised draft · Will ${willIndex+1}</h3><span class="pill">v${draft().version||'—'}</span></div><div class="cardbody"><p class="small muted">Upload a corrected PDF so the customer can view the latest version. Corrections do not create a new payment or mandatory approval step.</p><button class="btn small" style="margin-top:15px" onclick="adminPublish()">Publish corrected data preview</button><label class="btn soft" style="margin-top:15px">${ico('upload')} Upload revised PDF for Will ${willIndex+1}<input aria-label="Upload revised PDF" type="file" accept="application/pdf,.pdf" class="visually-hidden" onchange="uploadRevision(this)"></label>${draft().file?`<p class="small">Latest: ${esc(draft().file)}</p>`:''}</div></div><div class="card"><div class="cardhead"><h3>Application activity</h3></div><div class="cardbody">${state.audit.length?state.audit.slice(0,10).map(x=>`<div class="summaryrow"><span>${esc(x.text)}</span><span class="muted">${esc(x.time)}</span></div>`).join(''):'<p class="small muted">Actions taken in this test session will appear here.</p>'}</div></div></div><div class="stack"><div class="card"><div class="cardbody"><div class="eyebrow">Manage application</div><label class="field">Status<select id="admin-status">${['In progress','Awaiting OWA review','Action required','Ready for court','Submitted to ADJD','Registration completed'].map(s=>`<option ${state.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="check" style="margin-top:15px"><input type="checkbox" id="manual-check" ${state.manualReviewed?'checked':''}>I have manually reviewed the application and documents.</label><button class="btn primary" style="width:100%;margin-top:17px" onclick="updateStatus()">Save status</button><button class="btn" style="width:100%;margin-top:10px" onclick="newTicket('Information required')">Request information</button></div></div><div class="card"><div class="cardbody"><h3>Court payment</h3><p class="small muted">AED ${state.package==='couples'?'1,900':'950'} · paid directly to ADJD</p><label class="check" style="margin-top:15px"><input type="checkbox" ${state.courtPaid?'checked':''} onchange="state.courtPaid=this.checked;audit(this.checked?'Court payment recorded':'Court payment record removed');toast('Payment record updated')">Payment confirmed externally</label></div></div><div class="callout"><span>The registered Will is delivered by the court or admin outside this dashboard. Update the status when registration is completed.</span></div></div></div>`}
function modal(title,html){previousFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${title}</h2><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button></div><div class="modalbody"><div class="errorbox" id="modal-errors" role="alert" tabindex="-1"></div>${html}</div></section></div>`;document.body.style.overflow='hidden';$('#app')?.setAttribute?.('inert','');setTimeout(()=>$('.modal button, .modal input')?.focus(),10)}
function closeModal(){profileEdit=null;$('#modal-root').innerHTML='';document.body.style.overflow='';$('#app')?.removeAttribute?.('inert');previousFocus?.focus()}
document.addEventListener('keydown',e=>{if(!$('.modal'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...document.querySelectorAll('.modal button:not([disabled]),.modal input:not([disabled]),.modal select,.modal textarea,.modal a')].filter(x=>x.offsetParent);if(!els.length)return;if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
function editPerson(id){if(!id&&role==='customer'&&!customerCanEdit()){newTicket('Add a person to my Will');return}const p=person(id)||newPerson('p'+Date.now());profileEdit={person:structuredClone(p),original:id?JSON.stringify(p):null,isNew:!id};drawProfile()}
function drawProfile(){if(!profileEdit)return;const p=profileEdit.person,isTest=allWills().some(w=>w.testator===p.id),locked=role==='customer'&&!customerCanEdit();modal('Shared person profile',`<p class="small muted" style="margin-bottom:20px">${locked?'Details are read-only after submission. Replace documents here; ask OWA to correct details.':'Changes apply to every selected role only when you save. Cancel leaves the original profile unchanged.'}</p><div id="profile-fields">${personFields(p,isTest)}</div><hr class="divider"><div class="grid2">${uploadBox(p,'passport','Passport')}${p.resident?uploadBox(p,'eid','Emirates ID'):''}${isTest?uploadBox(p,'proof','Proof of address'):''}</div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><div class="row wrap"><button class="btn" onclick="saveProfile('${p.id}',${isTest},true)">Save incomplete profile</button><button class="btn primary" onclick="saveProfile('${p.id}',${isTest})">Save profile</button></div></div>`);if(locked){document.querySelectorAll('#profile-fields input').forEach(x=>x.readOnly=true);document.querySelectorAll('#profile-fields select').forEach(x=>x.disabled=true)}}
function saveProfile(id,isTest,allowIncomplete=false){if(!profileEdit||profileEdit.person.id!==id)return;const p=profileEdit.person,e=profileErrors(p,isTest);if(e.length&&!allowIncomplete){const box=$('#modal-errors');box.innerHTML='<strong>Please check these details before saving:</strong><ul>'+e.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';box.classList.add('show');box.focus();return}if(JSON.stringify(p)===profileEdit.original){closeModal();return}if(profileEdit.isNew)state.people.push(structuredClone(p));else state.people[state.people.findIndex(x=>x.id===id)]=structuredClone(p);invalidate();audit(`${role==='admin'?'Admin':'Customer'} saved ${e.length?'incomplete ':''}profile: ${p.name||'Unnamed person'}`);closeModal();render();toast(e.length?'Incomplete profile saved. Finish the missing details before review.':'Profile saved across all selected roles.')}
function updatePerson(id,key,value){if(role==='customer'&&!customerCanEdit())return;if(profileEdit?.person.id===id){profileEdit.person[key]=value;return}person(id)[key]=value;invalidate()}
function residentChange(id,v){if(role==='customer'&&!customerCanEdit())return;if(profileEdit?.person.id===id){profileEdit.person.resident=v==='yes';drawProfile();return}person(id).resident=v==='yes';invalidate();render()}
function attach(id,type,input){let f=input.files[0];if(!f)return;if(f.size===0||f.size>10*1024*1024||!(/\.(pdf|png|jpe?g)$/i.test(f.name))){toast('Choose a non-empty PDF, JPG or PNG smaller than 10 MB.');input.value='';return}if(profileEdit?.person.id===id){profileEdit.person.docs[type]=f.name;drawProfile();toast('File selected. Save the profile to apply this replacement.');return}person(id).docs[type]=f.name;invalidate();if(state.status!=='In progress')audit('Replacement '+type+' attached for '+name(id));render();toast('Filename attached for testing. Admin review is still required.')}
function demoExtract(){if(!customerCanEdit())return;let p=testator(),example=seed(true,state.package==='couples').people.find(x=>x.id===p.id);for(const key of ['name','dob','nationality','passport','expiry','eid'])p[key]=example[key];p.docs={...p.docs,passport:'sample-passport.pdf',...(p.resident?{eid:'sample-emirates-id.pdf'}:{})};invalidate();render();toast('Fictional identity details filled. Address proof still needs to be attached. No real OCR ran.')}
function reuseProof(){let a=person(state.wills[0].testator),b=testator();if(!a.docs.proof)return toast('Add the first partner’s address proof first.');if(a.address.trim().toLowerCase()!==b.address.trim().toLowerCase()||a.country!==b.country)return toast('The residential addresses must match before sharing proof.');b.docs.proof=a.docs.proof;invalidate();render();toast('Shared address proof linked to both testators.')}
function switchWill(i){willIndex=+i;benefitTab=0;render()}
function setChildren(v){current().hasChildren=v;invalidate();render()}
function chooseChild(){if(current().children.length>=5)return;modal('Add a child',`<label class="field">Choose a child under 18<select id="child-choice"><option value="">Select a person</option>${state.people.filter(p=>years(p.dob)<18&&!current().children.includes(p.id)).map(p=>`<option value="${p.id}">${esc(p.name)} · ${years(p.dob)} years</option>`).join('')}</select></label><div class="actions"><button class="btn" onclick="editPerson(null)">+ Create a new profile</button><button class="btn primary" onclick="addChild()">Add child</button></div>`)}
function addChild(){let id=$('#child-choice').value;if(!id)return toast('Choose a child first.');current().children.push(id);invalidate();closeModal();render()}
function removeChild(i){current().children.splice(i,1);invalidate();render()}
function setExecutor(i,id){current().executors[i]=id;invalidate();render()}
function addExecutor(){if(current().executors.length<3){current().executors.push('');invalidate();render()}}
function removeExecutor(){if(current().executors.length>1){current().executors.pop();invalidate();render()}}
function setGuardian(key,id){current().guardians[key]=id;invalidate();render()}
function setBeneficiary(g,i,id){current()[g][i].id=id;invalidate();render()}
function setShare(g,i,v){current()[g][i].share=v===''?'':Number(v);invalidate();$('#allocation-summary').innerHTML=allocationSummary(g)}
function addBeneficiary(g){if(current()[g].length<(g==='primary'?3:2)){current()[g].push({id:'',share:''});invalidate();render()}}
function removeBeneficiary(g,i){if(current()[g].length<=1)return;current()[g].splice(i,1);if(current()[g].length===1)current()[g][0].share=100;invalidate();render();toast(current()[g].length===1?'One beneficiary remains and receives 100%.':'Beneficiary removed. Review the remaining percentages.')}
function benefitNext(){if(benefitTab===0){let e=allocationErrors(current(),'primary',3);if(e.length)return showErrors(e);benefitTab=1;render();window.scrollTo(0,0)}else nextSection(4)}
function copyWill(){modal('Copy from the first Will?',`<p>This replaces the second Will’s beneficiaries, children and guardian appointments with the first Will’s choices.</p><p class="small muted">The partner beneficiary is swapped for the first partner. Executors stay separate and must be selected for this Will. All choices remain editable.</p><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmCopy()">Copy choices</button></div>`)}
function confirmCopy(){let a=state.wills[0],b=state.wills[1],swap=id=>id===b.testator?a.testator:id;for(let g of ['primary','substitutes'])b[g]=a[g].map(x=>({...x,id:swap(x.id)}));b.children=[...a.children];b.hasChildren=a.hasChildren;b.guardians=Object.fromEntries(Object.entries(a.guardians).map(([k,v])=>[k,swap(v)]));invalidate();closeModal();render();toast('Choices copied. Review the second Will and select its executors separately.')}
function generateDraft(){const e=allErrors();if(e.length)return showErrors(e);allWills().forEach(w=>{const d=draft(w);if(!d.version||d.needsRefresh)publishDraft(w)});save();setPage('preview')}
function openPreview(){setPage('preview')}
function submitReview(){if(allWills().some(w=>!draft(w).version||draft(w).needsRefresh))return toast('Generate up-to-date drafts before submitting.');if(!$('#confirm-draft')?.checked)return toast('Confirm you have reviewed the draft before continuing.');const e=allErrors();if(e.length)return toast('Some required details have changed. Return to review.');allWills().forEach(w=>w.confirmed=true);state.status='Awaiting OWA review';audit('Customer submitted application for OWA review');setPage('dashboard');toast('Application sent to the demo OWA review queue.')}
function adminDraft(){if(!draft().version)return toast('Generate a draft after the questionnaire is complete.');setPage('preview')}
function adminPublish(){if(role!=='admin')return;const e=allErrors();if(e.length)return toast('Complete required details for both Wills before publishing.');if(!draft().version)allWills().forEach(w=>publishDraft(w));else publishDraft(current());audit('Admin published data preview for Will '+(willIndex+1)+' v'+draft().version);render();toast('A corrected data preview is available to the customer.')}
function toggleRole(){role=role==='customer'?'admin':'customer';setPage(role==='admin'?'queue':'dashboard');toast(role==='admin'?'Demo admin view — this switch is not production authentication.':'Customer view')}
function newTicket(subject=''){modal(role==='admin'?'Request information':'How can we help?',`<form onsubmit="createTicket(event)"><div class="stack"><label class="field">Subject *<input id="ticket-subject" required value="${esc(subject)}" placeholder="A short description of your question"></label><label class="field">Category<select id="ticket-category"><option>Documents</option><option>Draft correction</option><option>Court registration</option><option>General question</option></select></label><label class="field">Message *<textarea id="ticket-message" required placeholder="Tell us what you need help with…"></textarea></label><label class="field">Attachment (optional)<input type="file" id="ticket-file" accept=".pdf,.png,.jpg,.jpeg"><span class="hint">Testing only: the filename is saved, not the file contents.</span></label><div class="actions"><span class="small muted">${role==='admin'?'The customer will see this in support.':'OWA will receive your request.'}</span><button class="btn primary" type="submit">Create ticket ${ico('arrow')}</button></div></div></form>`)}
function checkTicketFile(f){if(f&&(f.size===0||f.size>10*1024*1024||!(/\.(pdf|png|jpe?g)$/i.test(f.name)))){toast('Choose a PDF, JPG or PNG smaller than 10 MB.');return false}return true}
function createTicket(e){e.preventDefault();let f=$('#ticket-file').files[0];if(!checkTicketFile(f))return;let subject=$('#ticket-subject').value.trim(),message=$('#ticket-message').value.trim();if(!subject||!message)return toast('Enter a subject and message.');let id=String(state.tickets.length+1).padStart(4,'0');state.tickets.unshift({id,subject,category:$('#ticket-category').value,status:role==='admin'?'Waiting for customer':'Open',messages:[{role,text:message,file:f?.name||'',time:new Date().toLocaleString()}]});selectedTicket=id;if(role==='admin'&&!['Submitted to ADJD','Registration completed'].includes(state.status))state.status='Action required';audit(`${role==='admin'?'Admin':'Customer'} opened support ticket #${id}`);closeModal();setPage('support');toast('Ticket created in this demo. No email has been sent.')}
function sendReply(e,id){e.preventDefault();let value=$('#reply').value.trim(),f=$('#reply-file').files[0];if(!value)return toast('Write your reply.');if(!checkTicketFile(f))return;let t=state.tickets.find(x=>x.id===id);t.messages.push({role,text:value,file:f?.name||'',time:new Date().toLocaleString()});t.status=role==='admin'?'Waiting for customer':'Open';audit(`New ${role} reply on ticket #${id}`);render();toast('Reply added to the conversation.')}
function ticketStatus(id){let t=state.tickets.find(x=>x.id===id);t.status=t.status==='Resolved'?'Open':'Resolved';audit(`Ticket #${id}: ${t.status}`);render()}
function updateStatus(){let status=$('#admin-status').value,checked=$('#manual-check').checked;if(['Ready for court','Submitted to ADJD','Registration completed'].includes(status)&&!checked)return toast('Confirm manual review before advancing this application.');if(['Ready for court','Submitted to ADJD','Registration completed'].includes(status)&&allErrors().length)return toast('Required application details are still missing. Complete them before advancing.');if(['Ready for court','Submitted to ADJD','Registration completed'].includes(status)&&allWills().some(w=>!draft(w).version||draft(w).needsRefresh))return toast('Publish an updated draft for each affected Will before advancing.');state.status=status;state.manualReviewed=checked;audit('Admin changed application status to '+status);render();toast('Application status updated for the customer.')}
async function uploadRevision(input){if(role!=='admin')return;const f=input.files[0],w=current(),idx=willIndex;if(!f)return;if(f.size===0||f.size>10*1024*1024||!f.name.toLowerCase().endsWith('.pdf'))return toast('Choose a non-empty PDF smaller than 10 MB.');try{const sig=new Uint8Array(await f.slice(0,5).arrayBuffer());if(String.fromCharCode(...sig)!=='%PDF-')return toast('This file does not have a valid PDF header. Choose a PDF document.');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('read failed'));reader.readAsDataURL(f)});if(!state.wills.includes(w))return;publishDraft(w,f.name,data);audit('Admin uploaded revised PDF for Will '+(idx+1)+' v'+draft(w).version);render();toast('Revised PDF attached to Will '+(idx+1)+'. Viewable during this session only.')}catch{toast('The PDF could not be read. Try attaching it again.')}}
function revisedPreviewPage(){const d=draft();return head('Latest revised draft.',`Will ${willIndex+1} · ${esc(testator().name)} · Version ${d.version}`,'ADMIN REVISION')+`<div class="stack"><div class="card"><div class="cardbody"><h3>${esc(d.file)}</h3><p class="small muted">Published ${esc(d.publishedAt||'by OWA')}</p>${d.needsRefresh?'<div class="callout amber" style="margin-top:18px">New details are awaiting an updated draft. This is the last published revision.</div>':''}${d.data?'<button class="btn primary" style="margin-top:18px" onclick="viewUploadedDraft()">View revised PDF</button>':'<div class="callout amber" style="margin-top:18px">The uploaded PDF was available only in the earlier test session. Ask the demo admin to reattach it. This page does not substitute an older generated draft for the missing PDF.</div>'}</div></div><div class="row wrap"><button class="btn" onclick="newTicket('Draft correction')">Request a correction</button><button class="btn" onclick="setPage(role==='admin'?'adminreview':'dashboard')">Back to application</button></div></div>`}
function viewUploadedDraft(){modal('Latest revised draft',`<p class="small muted" style="margin-bottom:14px">This test viewer depends on your browser’s PDF support. Some managed browsers block embedded PDFs. The upload remains attached to this Will; production needs a protected document renderer.</p><iframe title="Latest admin draft" src="${draft().data}#toolbar=0&navpanes=0" style="width:100%;height:65vh;border:1px solid var(--line)"></iframe>`)}
function openClauseList(){modal('Draft sections',`<div class="docnav" style="display:block">${clauseNames.map((n,i)=>`<button onclick="clauseIndex=${i};closeModal();render()"><span class="stepnum">${i+1}</span>${n}<span class="dot"></span></button>`).join('')}</div>`)}
function exportSummary(type){let w=current(),p=testator();let doc=`<!doctype html><html><head><meta charset="utf-8"><title>OWA — TEST SUMMARY</title><style>body{font:14px Arial;max-width:800px;margin:45px auto;line-height:1.7}h1{color:#6243ad}table{border-collapse:collapse;width:100%}td{padding:10px;border:1px solid #ddd}@media print{button{display:none}}.mobile-section{display:none}.storage-warning{padding:12px 28px;background:#fff2e4;color:#79511f;border-bottom:1px solid #e5ca9e;font-size:12px}.storage-warning[hidden]{display:none}.savehint.unsaved{color:var(--red)}.savehint.unsaved:before{content:'!';color:var(--red)}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.btn:focus-within{outline:2px solid #ab8bdf}.cardhead .pill{flex-shrink:0;white-space:nowrap}.summaryrow>span:last-child{text-align:right;overflow-wrap:anywhere}.taskline>div{min-width:0}.taskline button{flex-shrink:0}.person strong{overflow-wrap:anywhere}@media(max-width:720px){.mobile-section{display:grid}.sidegroup{display:none}.actions .right{flex-wrap:wrap;justify-content:flex-end}.actions .right .savehint{max-width:125px}.summaryrow{flex-wrap:wrap}.cardhead{align-items:flex-start}.testbar button{min-height:30px}.remove{min-width:33px}.benefitrow{grid-template-columns:minmax(0,1fr) 75px 30px}.docbar{flex-wrap:wrap}.modal .actions{align-items:flex-start}.modal .actions .row{justify-content:flex-end}}
</style></head><body><h1>OWA · Application data summary</h1><p><strong>TEST ONLY — NOT A WILL OR COURT DOCUMENT</strong></p><h2>${esc(p.name)}</h2><p>${esc(p.address)}, ${esc(p.country)}</p><table><tr><td>Executors</td><td>${w.executors.filter(Boolean).map(id=>esc(name(id))).join(' → ')}</td></tr><tr><td>Primary beneficiaries</td><td>${w.primary.map(x=>`${esc(name(x.id))} ${x.share}%`).join('<br>')}</td></tr><tr><td>Shared substitutes</td><td>${w.substitutes.map((x,i)=>`${i?'B':'A'}: ${esc(name(x.id))} ${x.share}%`).join('<br>')}</td></tr><tr><td>Permanent guardian</td><td>${w.hasChildren?esc(name(w.guardians.permanent)):'Not applicable'}</td></tr><tr><td>Substitute permanent guardian</td><td>${w.hasChildren?esc(name(w.guardians.substitute)):'Not applicable'}</td></tr><tr><td>Temporary / interim guardian</td><td>${w.hasChildren&&w.guardians.temporary?esc(name(w.guardians.temporary)):'Not appointed'}</td></tr></table><p>Substitutes apply only if none of the primaries survives. Approved bilingual template rendering is a production integration.</p>${type==='html'?'<button onclick="window.print()">Print / Save as PDF</button>':''}<\/body><\/html>`;if(type==='html'){const win=window.open('','_blank');if(!win)return toast('Allow a new tab to open the printable admin summary.');win.document.open();win.document.write(doc);win.document.close()}else{let url=URL.createObjectURL(new Blob([doc],{type:'application/msword'})),a=document.createElement('a');a.href=url;a.download='OWA_TEST_Data_Summary.doc';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}toast('Admin test summary prepared. Not a legal Will.')}
function openTesting(){modal('Explore the prototype',`<p class="muted">Choose a starting point. Loading an example replaces only the test data stored by this prototype in this browser.</p><div class="stack" style="margin-top:22px"><button class="btn primary" onclick="loadExample(true,false)">Load a complete individual example →</button><button class="btn" onclick="loadExample(true,true)">Load a complete couples example →</button><button class="btn" onclick="loadExample(false,false)">Reset to the start · individual application</button><button class="btn" onclick="loadExample(false,true)">Reset to the start · couples application</button></div><hr class="divider"><div class="callout"><span>Use fictional information only. All data is stored in this browser, with no real payments, OCR, authentication or email delivery. Uploaded identity documents are represented by filenames only.</span></div><h3 style="margin-top:20px">A quick test route</h3><ol class="small muted"><li>Load a complete example and open the questionnaire.</li><li>Change beneficiary percentages to test the 100% check.</li><li>Generate the preview, review it and send to OWA.</li><li>Switch to Admin view, open the application, request information or upload a revised PDF.</li><li>Switch back to the customer to see the ticket, status and latest draft.</li></ol>`)}
function loadExample(complete,couples){if(storageConflict)return toast('Reload the latest saved state before resetting.');profileEdit=null;revisionBytes.clear();const previousSaved=state.saved;state=seed(complete,couples);state.saved=previousSaved;willIndex=0;role='customer';benefitTab=0;clauseIndex=0;selectedTicket=null;save();closeModal();setPage(complete?'wizard':'dashboard',complete?0:undefined);toast(complete?'Complete fictional example loaded. You can explore all sections.':'Reset complete. Your OWA service fee is already marked as paid for testing.')}
function openGuide(){modal('Developer handover notes',`<p class="small muted">21 October 2026 · Post-payment product prototype · User decisions take precedence over older screenshots.</p><table class="guidetable" style="margin-top:18px"><tbody>${[
['Design','Cream paper, purple controls, lavender panels, serif headings, and bilingual preview structure follow the supplied reference images. The 23 supplied screens informed the sections and admin/customer journeys.'],
['Screen mapping','06 Details → 07 Children → 08 Executors → 09 Guardians → 10 Beneficiaries → 11 Review. 12 becomes Overview; 13 becomes direct-to-court guidance; 14 Support; 15 view-only draft. 16 is admin-only output; 17–19 admin queue, review and support. Responsive layouts cover 21–23. Pre-payment 01–05/20 remain in the separate prototype.'],
['Payments','OWA fee already paid: Individual AED 999 / Couples AED 1,799. Court fee AED 950 per Will, paid directly to ADJD. No OWA court checkout and no combined total. These are owner-specified product prices, not a current court fee verification.'],
['Documents','Passport for every named person. Emirates ID when a UAE resident. Address for everyone; proof only for testators. Couples sharing an address may share proof. Phone and email required only for testators; partner phone numbers must differ, email can match. AI flags; manual review is mandatory.'],
['Identity model','Shared person records; appointments reference person IDs. Reuse documents across roles. Customer edits invalidate generated sample drafts before review. Modal edits commit only on Save. Admin changes reset manual verification and mark published snapshots as awaiting refresh. Publishing a corrected preview or uploading a PDF creates a separate version for the selected Will, without additional payment or mandatory customer reapproval.'],
['Children & guardians','Up to 5 children under 18. Permanent and substitute permanent guardians required when minors are included. Temporary = interim, optional, UAE resident with EID in the owner’s flow. One set covers all children.'],
['Executors','Up to three, ordered. First required; subsequent substitutes optional. Can reuse beneficiaries. Executors must be chosen separately for the second partner’s Will.'],
['Beneficiaries','One to three primaries, positive shares totalling 100%. If some do not survive, surviving primaries receive proportional original shares; sole survivor receives 100%. If none survives, one shared A/B group takes effect. A alone 100%, A/B independently total 100%. A’s own surviving-children fallback retained; do not copy it to B.'],
['Explicit assumption','Substitute A is required in this prototype, B optional. The business owner has not expressly confirmed skipping the entire substitute group. Approved English/Arabic wording must match the multi-primary adaptation before live generation. Preserve trust-age 21 separately from children-under-18 guardianship.'],
['Couples','One person can fill and confirm both; single application status. Both questionnaires must complete before draft generation. Copy beneficiaries/guardians and children with spouse replacement. Executor appointments remain separate.'],
['Draft & delivery','Customer sees latest draft via signed-in account, without a download/share action. The registered Will is sent outside the dashboard by court/admin. Admin needs real DOCX and PDF generation using the approved template. The prototype only exports clearly labelled test data summaries.'],
['Support & admin','Tickets available after OWA payment. Both parties can open tickets. Production must notify admin by email on new tickets/replies and notify customer of replies/status changes. External court portal corrections remain admin work. No automatic resubmission or legal signatures implemented.'],
['Production integrations','Email OTP, secure sessions and role enforcement; payment webhooks for OWA service fee; protected document storage; OCR with confidence flags; file scanning; approved bilingual template renderer; real DOCX/PDF; email notifications and 3-day incomplete-application reminders; audit log; document versioning. None is live in this HTML.'],
['Audit fixes','Independent per-Will draft snapshots and revisions; transactional profile editor; visible storage errors and multi-tab conflict warning; explicit children answer; strict dates, unique passports, ordered executors and normalized partner phones; completed-status preservation for tickets; accessible mobile section selector and keyboard upload controls.'],
['Prototype storage','Browser-local test data. File attachments save filenames only. Revised PDFs preview in-memory; no document persistence across reload. Local storage is not secure storage. Demo role switch is not authorization. View-only UI cannot prevent screenshots or extraction; production needs appropriate access controls.'],
['Acceptance route','Test missing fields and passport, no-minors branch, max limits, 99%/101% allocations, duplicate people, self-selection, existing-profile edits, couples phone conflict and copy, both-Will generation gate, tickets/replies/status, revised draft version, mobile layout, and save/reopen.'],
['Remaining legal implementation','This is a UI flow and data-mapping demonstration. It does not generate a registrable Will, make a legal eligibility determination, or provide authoritative inheritance calculations. Final bilingual clauses and unresolved fallback outcomes must come from the approved template/legal reviewer.']
].map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</tbody></table><button class="btn primary" style="margin-top:22px" onclick="closeModal()">Back to prototype</button>`)}
function openAudit(){modal('Audit & test results',`<p class="small muted">21 October 2026 · Functional prototype audit</p><div class="callout green" style="margin-top:16px"><span><strong>Automated regression suite: 34 checks passed.</strong><br>The first run reproduced 13 failures in 32 checks; these were corrected, with additional early-support-ticket and legacy-couples migration regression checks.</span></div><table class="guidetable" style="margin-top:18px"><tr><td>Draft integrity</td><td>Each Will now has its own version, published data snapshot, revision filename and in-memory PDF. Editing shared details no longer silently changes a published preview.</td></tr><tr><td>Profile editing</td><td>Cancel discards edits and new unsaved profiles. Validation happens before Save commits. Saving incomplete details is explicit. Admin edits reset manual verification and require republishing before progression.</td></tr><tr><td>Validation</td><td>Explicit children answer, real calendar dates, age checks, ordered executors, unique passports, normalized partner phone comparison, role limits and separate 100% beneficiary totals.</td></tr><tr><td>Storage</td><td>Storage failure is visible. A stale second tab cannot overwrite a newer saved application. Published metadata persists; uploaded PDF bytes deliberately stay in the current session.</td></tr><tr><td>Status & support</td><td>Later admin tickets preserve submitted/completed status. An information request before questionnaire completion still permits customer completion. Court fees remain payable directly to ADJD.</td></tr><tr><td>Browser checks</td><td>Profile cancellation, couples generation and submission, separate Will 2 PDF upload, Will 1 preservation, support/status handling, multi-tab warning, and responsive navigation were checked in the test browser.</td></tr><tr><td>Verification limits</td><td>The managed test browser blocked embedded PDF display; upload, revision assignment and missing-session messaging were checked. Real-device Safari/Firefox and screen-reader testing have not been performed.</td></tr><tr><td>Production work</td><td>Authentication, secure storage, OCR, payments, email delivery, approved bilingual legal clauses and actual court-ready DOCX/PDF generation remain integrations. A demo role switch and hidden PDF toolbar are not access controls.</td></tr></table><button class="btn primary" style="margin-top:20px" onclick="closeModal()">Return to testing</button>`)}
// Published snapshots and per-Will file metadata persist; PDF bytes stay in this page session only.
migrateDrafts();
window.addEventListener('storage',event=>{if(event.key==='owa-prototype-v1'&&event.newValue){try{const remote=JSON.parse(event.newValue);if(remote.saved>state.saved){storageConflict=true;storageIssue='A newer version was saved in another tab. Reload before editing.';closeModal();render()}}catch{}}});
render();
</script></body></html>
